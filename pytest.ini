[pytest]
# Pytest Configuration for Authentication System Tests

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test path
testpaths = .

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    admin: Tests for admin operations
    persistence: Tests for data persistence
    edge_case: Tests for edge cases
    authentication: Tests for authentication flows
    widget: Tests for UI widgets

# Timeout for tests (in seconds)
timeout = 10

# Log configuration
log_cli = false
log_file = test_results.log
log_file_level = INFO

# Coverage options
[coverage:run]
source = auth_screens
omit = 
    */tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
